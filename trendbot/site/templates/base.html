{% from "_macros.html" import logo, icon %}<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<title>{% block title %}ㄷㅅㅂㄱ{% endblock %}</title>
<link rel="icon" href="{{ root }}static/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ root }}static/logo.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="{{ root }}index.html" aria-label="ㄷㅅㅂㄱ 홈">{{ logo() }}</a>
    <span class="tagline">어제 인터넷 다시보기</span>
    <nav class="tabs-top">
      <a class="{{ 'on' if page in ('today','day') }}" href="{{ root }}index.html">오늘</a>
      <a class="{{ 'on' if page=='archive' }}" href="{{ root }}archive.html">지난 판</a>
      <a class="{{ 'on' if page=='status' }}" href="{{ root }}status.html">상태</a>
    </nav>
  </div>
</header>
<main class="layout">
{% block body %}{% endblock %}
</main>
<nav class="tabbar">
  <a class="{{ 'on' if page in ('today','day') }}" href="{{ root }}index.html">{{ icon('home') }}<span>오늘</span></a>
  <a class="{{ 'on' if page=='archive' }}" href="{{ root }}archive.html">{{ icon('grid') }}<span>지난 판</span></a>
  <a class="{{ 'on' if page=='status' }}" href="{{ root }}status.html">{{ icon('pulse') }}<span>상태</span></a>
</nav>
<div class="toast" id="toast"></div>
{% block script %}{% endblock %}
</body>
</html>
