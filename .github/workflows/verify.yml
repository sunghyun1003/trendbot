# 임시: 외부 기준 대조(이슈링크) 실제 접속 확인 (확인 후 삭제)
name: verify
on:
  push:
    paths: [".github/workflows/verify.yml"]
jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 이슈링크 순위 받아 비교 (빈 판 기준)
        run: |
          python - <<'PY'
          from trendbot import benchmark, storage
          b = benchmark.run(storage.connect(), {"cards": [], "champions": []})
          print({k: v for k, v in (b or {}).items() if k != "missed"})
          for m in (b or {}).get("missed", [])[:5]:
              print(m["site"], m["views"], m["title"][:40])
          PY
