# 임시: 새 주소(dsbg.pages.dev)에 팀원 로그인 잠금을 즉시 적용 (확인 후 삭제) - 2차
name: lock-now
on:
  push:
    branches: [claude/wizardly-edison-b339ub]
    paths: [.github/workflows/lock-now.yml]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m trendbot cloud-setup | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
      - name: 잠금 확인 (로그인 없이 열면 막혀야 함)
        run: |
          for u in https://dsbg.pages.dev/ https://dsbg.pages.dev/status.html; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$u"); echo "$u → $code" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = "302" ] || [ "$code" = "403" ] || exit 1
          done
