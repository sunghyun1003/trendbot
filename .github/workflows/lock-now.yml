# 임시: 새 주소(dsbg.pages.dev)에 팀원 로그인 잠금을 즉시 적용 (확인 후 삭제) - 3차
name: lock-now
on:
  push:
    branches: [claude/wizardly-edison-b339ub]
    paths: [.github/workflows/lock-now.yml]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m trendbot cloud-setup | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
      - name: 잠금 확인 (로그인 없이 열면 막혀야 함, 퍼지는 데 시간이 걸려 최대 3분 다시 확인)
        run: |
          for t in $(seq 1 18); do
            ok=1
            for u in https://dsbg.pages.dev/ https://dsbg.pages.dev/status.html https://trendbot-8se.pages.dev/; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$u"); echo "$t: $u → $code"
              case "$u:$code" in *:302|*:403|*trendbot-8se*:404|*trendbot-8se*:000|*trendbot-8se*:522|*trendbot-8se*:530) ;; *) ok=0;; esac
            done
            [ $ok = 1 ] && echo "잠금 확인 완료" | tee -a "$GITHUB_STEP_SUMMARY" && exit 0
            sleep 10
          done
          exit 1
