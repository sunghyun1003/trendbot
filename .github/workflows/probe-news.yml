# 임시: 관련 기사 검색 가능 여부 확인 (확인 후 삭제)
name: probe-news
on:
  push:
    branches: [claude/wizardly-edison-b339ub]
    paths: [.github/workflows/probe-news.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python tools/probe_news.py
