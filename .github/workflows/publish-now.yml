# 임시: 제목만 있는 글 보강(같은 이야기 원문·관련 기사) 실제 발행 확인 (확인 후 삭제)
name: publish-now
on:
  push:
    branches: [claude/wizardly-edison-b339ub]
    paths: [.github/workflows/publish-now.yml]
permissions:
  contents: write
jobs:
  publish:
    uses: ./.github/workflows/run.yml
    with:
      task: publish
    secrets: inherit
