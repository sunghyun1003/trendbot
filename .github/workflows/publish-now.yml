# 임시: 바뀐 판정 기준으로 오늘 피드를 다시 발행 (확인 후 삭제)
name: publish-now
on:
  push:
    branches: [claude/wizardly-edison-b339ub]
    paths: [.github/workflows/publish-now.yml]
permissions:
  contents: write
jobs:
  publish:
    uses: ./.github/workflows/run.yml
    with:
      task: publish
    secrets: inherit
