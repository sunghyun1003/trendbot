# 시험용: 집 PC 없이 GitHub 서버에서 수집→원문·사진→리포트까지 되는지 확인
name: cloud-probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/cloud-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: python -m trendbot snapshot || true
      - run: python -m trendbot daily --no-ai --no-deploy || true
      - run: python -m trendbot report | tee -a "$GITHUB_STEP_SUMMARY"
