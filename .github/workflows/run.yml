# ㄷㅅㅂㄱ 자동 실행 (GitHub 서버에서 돌아감. 설치 필요 없음)
# - 정시 실행: Cloudflare '정시 실행기'(worker/scheduler.js)가 06:30 발행, 2시간마다 수집을 시작합니다.
# - 아래 GitHub 자체 예약은 정시 실행기가 멈췄을 때를 위한 예비입니다 (늦게 돌 수 있음).
#   예비 발행은 그날 이미 발행됐으면 건너뜁니다.
# - 대시보드의 '지금 수집'·'지금 발행' 버튼도 이 작업을 실행합니다 (버튼 발행은 항상 실행).
# - 키는 저장소 Settings → Secrets and variables → Actions 에 넣습니다 (docs/keys-guide.md).
name: run
on:
  schedule:
    - cron: "27 16 * * *"   # 01:27 예비 수집 (한국 시각, 아래 모두 같음)
    - cron: "47 21 * * *"   # 06:47 예비 발행 (이미 발행됐으면 건너뜀)
    - cron: "57 2 * * *"    # 11:57 예비 수집
    - cron: "57 7 * * *"    # 16:57 예비 수집
    - cron: "57 12 * * *"   # 21:57 예비 수집
  workflow_call:              # '처음 설정'이 끝나면 첫 발행으로 이어서 부름
    inputs:
      task:
        type: string
        default: publish
  workflow_dispatch:
    inputs:
      task:
        description: "collect = 수집만, publish = 수집 + 발행, publish_auto = 오늘 아직 발행 안 했을 때만 발행"
        default: collect
        type: choice
        options: [collect, publish, publish_auto]
concurrency:
  group: trendbot-run       # 두 작업이 동시에 데이터를 고치지 않게 차례로 실행
  cancel-in-progress: false
permissions:
  contents: write           # 데이터(DB)를 data 브랜치에 저장
env:
  TZ: Asia/Seoul
  TASK: ${{ github.event_name == 'schedule' && (github.event.schedule == '47 21 * * *' && 'publish_auto' || 'collect') || inputs.task || 'collect' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}      # 올리기 전 로그인 잠금 점검에 씀
  DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
  SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt playwright

      - name: 지난 데이터 불러오기
        run: |
          mkdir -p data/media
          if git ls-remote --exit-code origin data >/dev/null; then
            git fetch --depth=1 origin data          # 실패하면 여기서 멈춤 (빈 DB로 덮어쓰지 않게)
            git show FETCH_HEAD:trendbot.db > data/trendbot.db
            echo "DB $(du -h data/trendbot.db | cut -f1) 불러옴"
          else
            echo "처음 실행: 새 DB로 시작"
          fi
      - name: 사진 보관함 불러오기
        id: media
        uses: actions/cache/restore@v4
        with:
          path: data/media
          key: media-${{ github.run_id }}
          restore-keys: media-

      - name: 발행할지 정하기
        run: |
          if [ "$TASK" = "publish" ]; then echo "PUBLISH=yes" >> "$GITHUB_ENV"
          elif [ "$TASK" = "publish_auto" ] && ! python -m trendbot published-today; then echo "PUBLISH=yes" >> "$GITHUB_ENV"
          else echo "PUBLISH=no" >> "$GITHUB_ENV"; fi
      - name: 수집
        run: python -m trendbot snapshot || echo "일부 사이트 실패 (상태 화면에 표시됨)"

      - name: 발행 준비 (브라우저·Node)
        if: env.PUBLISH == 'yes'
        run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        if: env.PUBLISH == 'yes'
        with:
          node-version: "22"
      - name: 오늘의 판 만들기 + 사이트 올리기
        if: env.PUBLISH == 'yes'
        run: |
          flags=""
          [ -z "$ANTHROPIC_API_KEY" ] && flags="$flags --no-ai" && echo "AI 키가 없어 원제목으로 발행"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            flags="$flags --no-deploy"; echo "Cloudflare 키가 없어 사이트는 올리지 않음"
          fi
          python -m trendbot daily $flags

      - name: 데이터 저장
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s data/trendbot.db ] || exit 0
          tmp=$(mktemp -d) && cp data/trendbot.db "$tmp/" && cd "$tmp"
          git init -q -b data && git add trendbot.db
          git -c user.name=trendbot -c user.email=trendbot@users.noreply.github.com commit -qm "데이터 $(date '+%F %H:%M')"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
      - name: 사진 보관함 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/media
          key: media-${{ github.run_id }}
      - name: 결과 요약
        if: always()
        run: python -m trendbot report >> "$GITHUB_STEP_SUMMARY" || true
