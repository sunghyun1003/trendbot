# 임시: 수집만 해도 상태 탭이 새로 올라가는지 확인 (확인 후 삭제)
name: verify-collect
on:
  push:
    branches: [claude/wizardly-edison-b339ub]
    paths: [.github/workflows/verify-collect.yml]
permissions:
  contents: write
jobs:
  collect:
    uses: ./.github/workflows/run.yml
    with:
      task: collect
    secrets: inherit
