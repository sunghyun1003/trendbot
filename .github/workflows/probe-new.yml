# 임시: 새 소스 화면 샘플 받기 (확인 후 삭제)
name: probe-new
on:
  push:
    paths: [".github/workflows/probe-new.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 샘플 받기
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          get() { curl -sL -m 25 -A "$UA" -H "Accept-Language: ko-KR,ko;q=0.9" -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> index.txt || echo "$1 ERR" >> index.txt; }
          get trends24_robots.txt https://trends24.in/robots.txt
          get trends24_korea.html https://trends24.in/korea/
          get getdaytrends_robots.txt https://getdaytrends.com/robots.txt
          get getdaytrends_korea.html https://getdaytrends.com/korea/
          get naver_ent_robots.txt https://m.entertain.naver.com/robots.txt
          get naver_ent_ranking.html https://m.entertain.naver.com/ranking
          get naver_ent_robots2.txt https://entertain.naver.com/robots.txt
          get naver_ent_ranking2.html https://entertain.naver.com/ranking
          get daum_ent_robots.txt https://entertain.daum.net/robots.txt
          get daum_ent_ranking.html https://entertain.daum.net/ranking/popular
          get gnews_ent.xml "https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=ko&gl=KR&ceid=KR:ko"
          get naver_cafe_robots.txt https://cafe.naver.com/robots.txt
          cat index.txt
      - name: 임시 브랜치에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && git init -q -b probe-out && git add . 
          git -c user.name=t -c user.email=t@users.noreply.github.com commit -qm probe
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" probe-out
