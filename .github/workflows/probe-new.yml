# 임시: 펨코 인기글 간접 수집 경로 확인 (확인 후 삭제)
name: probe-new
on:
  push:
    paths: [".github/workflows/probe-new.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 샘플 받기
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (compatible; dsbg-trendbot/0.1; internal team archive)"
          get() { curl -sL -m 25 -A "$UA" -H "Accept-Language: ko-KR,ko;q=0.9" -o "$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> index.txt || echo "$1 ERR" >> index.txt; sleep 4; }
          get il_fm3.html "https://www.issuelink.co.kr/community/listview/fmkorea/3/adj/_self/blank/blank/blank"
          get il_fm24.html "https://www.issuelink.co.kr/community/listview/fmkorea/24/adj/_self/blank/blank/blank"
          get il_fm_go.html "https://www.issuelink.co.kr/community/go/fmkorea/10441799708"
          cat index.txt
      - name: 임시 브랜치에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && git init -q -b probe-out && git add .
          git -c user.name=t -c user.email=t@users.noreply.github.com commit -qm probe
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" probe-out
