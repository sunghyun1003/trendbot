# 임시: 후보 게시판 화면·robots.txt 샘플 받기 (확인 후 삭제)
name: probe-new
on:
  push:
    paths: [".github/workflows/probe-new.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 샘플 받기
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          get() { curl -sL -m 25 -A "$UA" -H "Accept-Language: ko-KR,ko;q=0.9" -o "$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> index.txt || echo "$1 ERR" >> index.txt; }
          get inven_robots.txt https://www.inven.co.kr/robots.txt
          get inven_issue.html "https://www.inven.co.kr/board/webzine/2097?my=chuchu"
          get mlbpark_robots.txt https://mlbpark.donga.com/robots.txt
          get mlbpark_best.html "https://mlbpark.donga.com/mp/best.php?b=bullpen&m=like"
          get mlbpark_bullpen.html "https://mlbpark.donga.com/mp/b.php?b=bullpen"
          get slr_robots.txt https://www.slrclub.com/robots.txt
          get slr_hot.html "https://www.slrclub.com/bbs/zboard.php?id=hot_article"
          get todayhumor_robots.txt https://www.todayhumor.co.kr/robots.txt
          get todayhumor_best.html "https://www.todayhumor.co.kr/board/list.php?table=bestofbest"
          get theqoo_square.html https://theqoo.net/square
          get theqoo_hot2.html "https://theqoo.net/hot?filter_mode=normal&page=2"
          cat index.txt
      - name: 임시 브랜치에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && git init -q -b probe-out && git add .
          git -c user.name=t -c user.email=t@users.noreply.github.com commit -qm probe
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" probe-out
