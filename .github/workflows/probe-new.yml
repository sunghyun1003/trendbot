# 임시: 이슈링크 추가 활용 후보 확인 (확인 후 삭제)
name: probe-new
on:
  push:
    paths: [".github/workflows/probe-new.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 샘플 받기
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (compatible; dsbg-trendbot/0.1; internal team archive)"
          get() { curl -sL -m 25 -A "$UA" -H "Accept-Language: ko-KR,ko;q=0.9" -o "$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> index.txt || echo "$1 ERR" >> index.txt; sleep 3; }
          get il_communities.html https://www.issuelink.co.kr/community/listview
          get il_all24.html "https://www.issuelink.co.kr/community/listview/all/24/adj/_self/blank/blank/blank"
          get il_comment24.html "https://www.issuelink.co.kr/community/listview/all/24/comment/_self"
          get il_tag24.html "https://www.issuelink.co.kr/community/tag/all/24/_self"
          get il_filter.html "https://www.issuelink.co.kr/community/filterview/none/3/adj/_self/blank/blank/blank"
          for site in etoland.co.kr www.ygosu.com www.dogdrip.net www.todayhumor.co.kr www.slrclub.com www.ddanzi.com www.82cook.com theqoo.net www.instiz.net gall.dcinside.com; do
            get "robots_${site}.txt" "https://${site}/robots.txt"
          done
          for code in etoland ygosu dogdrip todayhumor ddanzi slrclub; do
            get "il_${code}.html" "https://www.issuelink.co.kr/community/listview/${code}/3/adj/_self/blank/blank/blank"
          done
          cat index.txt
      - name: 임시 브랜치에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && git init -q -b probe-out && git add .
          git -c user.name=t -c user.email=t@users.noreply.github.com commit -qm probe
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" probe-out
